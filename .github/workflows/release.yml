name: Release

# Publishes the component packages a tag already builds.
#
# Each package is the exact directory shape `south-provider-runtime` loads —
# `manifest.json` next to `component.wasm` — so a host consumes a release by
# extracting an archive and pointing its component directory at the result.
#
# Beside the archives: one gate ② report per package, naming the exact
# component.wasm it judged, and `south-release-index.json`, the
# machine-readable index generated from the archived manifests.
#
# See docs/design/2026-09-10-released-component-artifacts.md and
# docs/design/2026-09-30-host-zero-vendor-boundary.md sections 8.6 and 9.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and attaching artifacts. Scoped to this job; the
      # workflow default above stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guest-linked crate version check compares this tree with the
          # previous release tag, so it needs the tags and their history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.96.0
          # The components are wasm32-wasip2 guests built as child cargo
          # invocations, exactly as in ci.yml.
          targets: wasm32-wasip2

      # The one check this workflow adds. Every existing test proves a shipped
      # manifest matches *the version being built*; none proves that version
      # matches *the tag being released*. Tagging v0.27.0 on a tree whose
      # workspace version still reads 0.26.0 would publish three manifests
      # declaring south_runtime "0.26.0" under a v0.27.0 release, and every
      # test would pass, because each is individually telling the truth.
      - name: Tag matches workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Read the component runtime workspace version directly. The task
          # libraries and the three crates every component links
          # (south-contracts, south-provider-api, south-component-conformance)
          # carry versions of their own, so that a release which leaves them
          # alone re-identifies no package (boundary record §16 Q47);
          # selecting an arbitrary package from cargo metadata would mix the two.
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            echo "bump the workspace version, or retag; a release must not rename a build" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches workspace version ${version}"

      # The other half of Q47 (boundary record §13.12): south-contracts,
      # south-provider-api and south-component-conformance carry their own
      # versions, so one that changed since the previous release tag must carry a
      # new one. Its packages would fail digest stability anyway; the crate would
      # not, and a host's Cargo.lock would show the old version over new source.
      # Fails on a shallow clone or any git error rather than skipping.
      - name: Guest-linked crate versions
        run: python3 scripts/check_crate_versions.py --tag "${GITHUB_REF_NAME}"

      # The same scripts the sandbox parity tests drive. A release must build
      # what CI proved, not a second recipe that could diverge from it.
      - name: Build components
        run: |
          set -euo pipefail
          scripts/build-reference-component.sh
          scripts/build-anthropic-component.sh
          scripts/build-bedrock-converse-component.sh
          scripts/build-bedrock-converse-bearer-component.sh
          scripts/build-gemini-component.sh
          scripts/build-kling-task-component.sh
          scripts/build-kling-task-v2-component.sh
          scripts/build-minimax-task-v2-component.sh
          scripts/build-bailian-task-v2-component.sh
          scripts/build-xai-task-v2-component.sh
          scripts/build-byteplus-task-v2-component.sh
          scripts/build-veo-task-v2-component.sh
          scripts/build-wan-image-task-v2-component.sh
          scripts/build-gmi-image-task-v2-component.sh
          scripts/build-embeddings-openai-compatible-component.sh
          scripts/build-embeddings-gemini-component.sh
          scripts/build-embeddings-vertex-component.sh

      # Gate ② over the bytes just built: each sandbox parity test runs the
      # package's required suite against its component.wasm and, with
      # SOUTH_GATE2_REPORT_DIR set, writes a report naming that wasm's digest.
      # The build scripts the tests invoke are no-ops on the fresh build above;
      # the index step below refuses a report whose digest differs from the
      # archived component.wasm, so a rebuild in between could not slip by.
      - name: Gate ② reports
        env:
          SOUTH_GATE2_REPORT_DIR: ${{ github.workspace }}/target/gate2-reports
        run: |
          set -euo pipefail
          cargo test -p south-component-conformance --features sandbox \
            --test sandbox_parity_v1 \
            --test anthropic_sandbox_parity_v1 \
            --test bedrock_converse_sandbox_parity_v1 \
            --test bedrock_converse_bearer_sandbox_parity_v1 \
            --test gemini_sandbox_parity_v1 \
            --test kling_task_sandbox_parity_v1 \
            --test kling_task_sandbox_parity_v2 \
            --test minimax_task_sandbox_parity_v2 \
            --test bailian_task_sandbox_parity_v2 \
            --test xai_task_sandbox_parity_v2 \
            --test byteplus_task_sandbox_parity_v2 \
            --test veo_task_sandbox_parity_v2 \
            --test wan_image_task_sandbox_parity_v2 \
            --test gmi_image_task_sandbox_parity_v2 \
            --test openai_compatible_embeddings_sandbox_parity \
            --test gemini_embeddings_sandbox_parity \
            --test vertex_embeddings_sandbox_parity \
            -- --exact the_sandboxed_component_passes_gate_two_byte_for_byte
          ls -l "${SOUTH_GATE2_REPORT_DIR}"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          package() {
            component="$1"   # directory under components/
            artifact="$2"    # .wasm basename cargo produced
            staged="$(mktemp -d)"
            cp "components/${component}/manifest.json" "${staged}/manifest.json"
            cp "components/${component}/target/wasm32-wasip2/release/${artifact}" \
               "${staged}/component.wasm"
            # Archive root holds the two files and nothing else: extracting it
            # yields the runtime's directory shape with no renaming step.
            tar -czf "dist/${component}-${GITHUB_REF_NAME}.tar.gz" -C "${staged}" \
              manifest.json component.wasm
            rm -rf "${staged}"
            cp "target/gate2-reports/${component}.gate2.json" \
               "dist/${component}-${GITHUB_REF_NAME}.gate2.json"
          }
          package provider-openai-compatible provider_openai_compatible.wasm
          package provider-anthropic provider_anthropic.wasm
          package provider-bedrock-converse provider_bedrock_converse.wasm
          package provider-bedrock-converse-bearer provider_bedrock_converse_bearer.wasm
          package provider-gemini provider_gemini.wasm
          package task-kling task_kling.wasm
          package task-kling-v2 task_kling_v2.wasm
          package task-minimax-v2 task_minimax_v2.wasm
          package task-bailian-v2 task_bailian_v2.wasm
          package task-xai-v2 task_xai_v2.wasm
          package task-byteplus-v2 task_byteplus_v2.wasm
          package task-veo-v2 task_veo_v2.wasm
          package task-wan-image-v2 task_wan_image_v2.wasm
          package task-gmi-image-v2 task_gmi_image_v2.wasm
          package embeddings-openai-compatible embeddings_openai_compatible.wasm
          package embeddings-gemini embeddings_gemini.wasm
          package embeddings-vertex embeddings_vertex.wasm
          # Catalog data (boundary record §7.5, §13.11): each catalogs/<name>.json is
          # published verbatim as <name>-<tag>.json; the index step below refuses a
          # published catalog whose bytes differ from the source file.
          shopt -s nullglob
          for catalog in catalogs/*.json; do
            cp "${catalog}" "dist/$(basename "${catalog}" .json)-${GITHUB_REF_NAME}.json"
          done

      # A package's south_runtime is the oldest runtime it needs, not this release
      # (boundary record §13.6). Each archived package is loaded under exactly the
      # runtime it declares: gate ①, the range handshake, the import scan and the
      # identity probe run in a checkout of that runtime's tag, so a package that
      # claims an older runtime than it needs fails the release here rather than in
      # a host.
      - name: Declared runtimes admit their packages
        run: |
          set -euo pipefail
          scripts/check-declared-runtime.sh --dist dist --tag "${GITHUB_REF_NAME}"

      # Generated from the archived manifests and the published catalogs, never
      # hand-written. It refuses a missing archive, an archive without a
      # components/ directory, a manifest that differs from the source tree, a
      # missing, failing or mismatched gate ② report, and a catalog that is
      # missing, differs from catalogs/, or declares an unknown schema.
      - name: Release index
        run: |
          set -euo pipefail
          python3 scripts/release_index.py generate \
            --dist dist --tag "${GITHUB_REF_NAME}" --require-gate2-reports
          cat dist/south-release-index.json

      # A package whose version did not change must not change its
      # component.wasm bytes or its manifest.json (boundary record §8.6,
      # §13.6): compared against the previous release's index, and a
      # difference fails the release. A catalog's data may change between
      # releases; a catalog schema the previous release published may not
      # disappear unless it is listed as retired (§13.11).
      - name: Digest stability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')"
          previous="$(printf '%s\n' "${tags}" \
            | python3 scripts/release_index.py previous-tag --current "${GITHUB_REF_NAME}")"
          if [ -z "${previous}" ]; then
            echo "no release earlier than ${GITHUB_REF_NAME}; digest stability check skipped"
            exit 0
          fi
          assets="$(gh release view "${previous}" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "${assets}" | grep -qxF south-release-index.json; then
            echo "release ${previous} has no south-release-index.json; digest stability check skipped"
            exit 0
          fi
          prev_dir="$(mktemp -d)"
          gh release download "${previous}" --dir "${prev_dir}" \
            --pattern south-release-index.json --pattern SHASUMS256.txt
          (cd "${prev_dir}" && sha256sum --check --ignore-missing SHASUMS256.txt)
          echo "comparing against ${previous}"
          python3 scripts/release_index.py compare \
            --previous "${prev_dir}/south-release-index.json" \
            --current dist/south-release-index.json

      - name: Checksums
        run: |
          set -euo pipefail
          # sha256sum output, so a host verifies with `sha256sum --check` and
          # no bespoke tooling. Covers the archives, the gate ② reports, the
          # catalogs and the index.
          (cd dist && sha256sum ./*.tar.gz ./*.gate2.json ./*-"${GITHUB_REF_NAME}".json \
            ./south-release-index.json > SHASUMS256.txt)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > dist/NOTES.md <<'NOTES'
          Component packages built from this tag — provider components for the
          chat world, task components for the task worlds, and embeddings
          components for the embeddings world.

          Each archive holds `manifest.json` and `component.wasm` at its root —
          the directory shape `south-provider-runtime` loads. Extract one and
          point a host's component directory at the result.

          `south-release-index.json` lists every package with its world,
          families, compatibility declaration and the digests of the archive,
          its `manifest.json` and its `component.wasm`. Each
          `<package>-<tag>.gate2.json` is the gate ② report CI produced for
          that exact `component.wasm`; the index carries its digest.

          `model-catalog-<tag>.json` (schema `south.model-catalog.v1`) is the
          model catalog data: capabilities by upstream model id. The index lists
          it under `catalogs` with its digest.

          Verify with `sha256sum --check SHASUMS256.txt`.

          These are first-party builds identified by checksum, not signature;
          see `docs/design/2026-09-10-released-component-artifacts.md` section 6.
          NOTES
          # The heredoc above is indented for readability; strip that indent so
          # the published notes are not a Markdown code block.
          sed -i 's/^          //' dist/NOTES.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md \
            dist/*.tar.gz dist/*.gate2.json dist/*-"${GITHUB_REF_NAME}".json \
            dist/south-release-index.json \
            dist/SHASUMS256.txt
