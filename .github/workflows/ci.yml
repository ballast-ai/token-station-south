name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          # The runtime tests and the sandbox parity test build real
          # wasm32-wasip2 guest components as child cargo invocations.
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit,cargo-machete
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --all-features
      - name: Doctest
        run: cargo test --workspace --doc --all-features
      - name: No default features
        run: cargo test --workspace --no-default-features
      - name: Fuzz target compile check
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      - name: MSRV
        run: rustup run 1.96.0 cargo check --workspace --all-targets
      - name: Dependency boundaries
        run: |
          scripts/check-boundaries.sh --self-test
          scripts/check-boundaries.sh
      # The release index generator and the digest-stability check (release.yml).
      # Standard-library Python with no setup; it runs in well under a second.
      - name: Release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Licenses and sources
        run: |
          cargo deny check
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check
      - name: Security advisories
        run: |
          cargo audit
          cargo audit --file fuzz/Cargo.lock
      - name: Unused dependencies
        run: |
          cargo machete
          (cd fuzz && cargo machete)

  # English-only, enforced rather than requested. CONTRIBUTING.md and AGENTS.md
  # have both stated the rule from the start; it still drifted to ~1175 CJK lines
  # across 46 files and six Chinese release-commit titles, because nothing ever
  # failed. `scripts/language-baseline.txt` records the backlog so this gate
  # blocks *growth* from day one instead of blocking every PR until the backlog
  # is translated.
  #
  # Its own job, not a step in `quality`, for one reason: the commit-message half
  # needs real history (`fetch-depth: 0`), and paying for a full clone in the
  # build job would slow every run.
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Language gate self-test
        run: scripts/check-language.sh --self-test
      - name: Tracked files are English
        run: scripts/check-language.sh
      - name: Commit messages are English
        if: github.event_name == 'pull_request'
        run: |
          scripts/check-language.sh --commits \
            '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-08-15
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz untrusted headers
        run: rustup run nightly-2026-08-15 cargo fuzz run safe_headers -- -max_total_time=600
      - name: Fuzz untrusted contract parsers
        run: |
          mkdir -p fuzz/corpus/contract_parsers
          cp fuzz/seeds/contract_parsers/*.json fuzz/corpus/contract_parsers/
          rustup run nightly-2026-08-15 cargo fuzz run contract_parsers -- -max_total_time=600
