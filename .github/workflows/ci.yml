name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# A new push to a pull request supersedes that pull request's still-running CI. Every other event
# (a push to main, the weekly schedule) gets its own group, so it always runs to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          # The runtime tests and the sandbox parity test build real
          # wasm32-wasip2 guest components as child cargo invocations.
          targets: wasm32-wasip2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit,cargo-machete
      # Without a cache every run compiles wasmtime and the other dependencies from scratch, in
      # the lint, test, no-default-features and doc steps alike. The root workspace, the fuzz
      # workspace and every runtime-test guest are separate cargo workspaces with their own
      # `target/`, so each is listed. The component packages are separate workspaces too, but
      # `scripts/component-build.sh` builds them all in the root's `target/components`, which the
      # root entry covers. Only main saves the cache: a pull request restores main's, and never
      # evicts it with a cache of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            crates/south-component-conformance/tests/guests/synthetic-speech
            crates/south-provider-runtime/tests/guests/t03-canary-provider
            crates/south-provider-runtime/tests/guests/t09-canary-task
            crates/south-provider-runtime/tests/guests/t21-unseen-eventstream
            crates/south-provider-runtime/tests/guests/test-embeddings
            crates/south-provider-runtime/tests/guests/test-image
            crates/south-provider-runtime/tests/guests/test-speech
            crates/south-provider-runtime/tests/guests/test-provider
            fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --all-features
      # The declared-runtime discipline (boundary record §13.6): every package's
      # south_runtime is the oldest runtime it needs, and each package is loaded under
      # exactly that runtime's release tag. release.yml runs the same check on the
      # archives it publishes; running it on the release pull request as well catches
      # a wrong declaration before the tag exists. Only release branches pay for it:
      # it builds one older runtime per distinct declaration. It is a step here rather
      # than its own job because the Test step's nextest setup script has just built
      # every component, so the build scripts below are no-ops instead of a second
      # build of every component on another runner.
      - name: Declared runtimes admit their packages
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        run: |
          set -euo pipefail
          for script in scripts/build-*-component.sh; do
            bash "${script}"
          done
          scripts/check-declared-runtime.sh --build
      - name: Doctest
        run: cargo test --workspace --doc --all-features
      # `sandbox` on south-component-conformance is the workspace's only feature and is off by
      # default, so for every other crate this build is the all-features build. Every crate still
      # has to compile without default features; only the one crate with a feature has tests that
      # change, so only its tests run again.
      - name: No default features
        run: |
          cargo check --workspace --all-targets --no-default-features
          cargo test -p south-component-conformance --no-default-features
      - name: Fuzz target compile check
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      # A no-op while the pinned toolchain is a release of the MSRV (Clippy has already compiled
      # every target on it); a real check once the two diverge.
      - name: MSRV
        run: python3 scripts/check_msrv.py
      - name: Dependency boundaries
        run: |
          scripts/check-boundaries.sh --self-test
          scripts/check-boundaries.sh
      # The release index generator, the digest-stability check and the
      # guest-linked crate version check (release.yml).
      # Standard-library Python with no setup; it runs in a few seconds.
      - name: Release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Licenses and sources
        run: |
          cargo deny check
          cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked check
      - name: Security advisories
        run: |
          cargo audit
          cargo audit --file fuzz/Cargo.lock
      - name: Unused dependencies
        run: |
          cargo machete
          (cd fuzz && cargo machete)

  # English-only, enforced rather than requested. CONTRIBUTING.md and AGENTS.md
  # have both stated the rule from the start; it still drifted to ~1175 CJK lines
  # across 46 files and six Chinese release-commit titles, because nothing ever
  # failed. `scripts/language-baseline.txt` records the backlog so this gate
  # blocks *growth* from day one instead of blocking every PR until the backlog
  # is translated.
  #
  # Its own job, not a step in `quality`, for one reason: the commit-message half
  # needs real history (`fetch-depth: 0`), and paying for a full clone in the
  # build job would slow every run.
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Language gate self-test
        run: scripts/check-language.sh --self-test
      - name: Tracked files are English
        run: scripts/check-language.sh
      - name: Commit messages are English
        if: github.event_name == 'pull_request'
        run: |
          scripts/check-language.sh --commits \
            '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'

  # The Q47 crate version check (boundary record §13.12), which release.yml
  # also runs on the tag: a guest-linked crate changed since the previous release
  # tag must carry a new version. Only release branches run it, because only
  # there does the workspace version name the release being cut; elsewhere it
  # names the release already published, and the comparison would be with the
  # release before that. Its own job so it costs a clone, not a component build.
  crate-versions:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Guest-linked crate versions
        run: python3 scripts/check_crate_versions.py --unreleased

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-08-15
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-fuzz
      # The cargo-fuzz binary that install-action fetches is built for musl, and cargo-fuzz
      # defaults `--target` to its own build target. The address sanitizer cannot link against
      # a statically linked libc, so every scheduled run since that binary changed failed before
      # fuzzing. Name the runner's own target explicitly.
      - name: Fuzz untrusted headers
        run: >-
          rustup run nightly-2026-08-15 cargo fuzz run --target x86_64-unknown-linux-gnu
          safe_headers -- -max_total_time=600
      - name: Fuzz untrusted contract parsers
        run: |
          mkdir -p fuzz/corpus/contract_parsers
          cp fuzz/seeds/contract_parsers/* fuzz/corpus/contract_parsers/
          rustup run nightly-2026-08-15 cargo fuzz run --target x86_64-unknown-linux-gnu \
            contract_parsers -- -max_total_time=600
