version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # wasmtime and wasmtime-wasi share a lockstep major version; bumping
      # one without the other never builds.
      wasmtime:
        patterns:
          - wasmtime
          - wasmtime-wasi
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
