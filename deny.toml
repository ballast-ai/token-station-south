[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  # The wasmtime family used by south-provider-runtime offers only this license.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  # foldhash, the default hashbrown hasher in the wasmtime dependency tree.
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
# The kernel mirror distributes the Canonical IR at fixed revisions; conformance
# gate 2 (component behavior) is the one sanctioned typed consumer (S0 invariant).
allow-git = ["https://github.com/ballast-ai/token-station-kernel"]
