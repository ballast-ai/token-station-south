[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/GlimpseEngine/token-station-south"
rust-version = "1.96"
version = "0.51.1"

[workspace.dependencies]
base64 = "0.23.1"
bytes = "1.10.1"
http = "1.3.1"
proptest = "1.7.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = "1.0.219"
serde_json = "1.0.140"
# The runtime digests each package it admits (load_package_set) and the gate 2 report digests
# the component it judged. Already in the graph through wasmtime (cranelift-codegen), so this
# adds no crate.
sha2 = "0.11.0"
static_assertions = "1.1.0"
thiserror = "2.0.12"
token-station-protocol = { version = "0.5.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "c2581f37ad468201c903e0d596b59e796173e459" }
tokio = "1.52.3"
tokio-util = "0.7.18"
url = "2.5.4"
wasmtime = { version = "49", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    # Compilation cache: compiling each component with Cranelift on every start
    # takes seconds; persist by content and config hash.
    "cache",
    # Tests hand-write WAT for a component importing wasi:sockets to prove the
    # rejection path. Production loads binary .wasm without WAT.
    "wat",
] }
wasmtime-wasi = "49"
wasmtime-wasi-io = { version = "49", default-features = false, features = ["std"] }
wit-parser = "0.260"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# The tests JIT-compile real wasm components through wasmtime and Cranelift. At the default dev
# opt-level 0 that compile alone took about 3.6 s per test process, against about 0.6 s with the
# packages below optimized, and 10-17 s on a 4-vCPU CI runner where several run at once.
#
# Only the packages that run during that compile are listed, not all dependencies: a blanket
# `[profile.dev.package."*"]` also optimizes about 300 packages, most of them proc-macros and
# build-time tools, and made the cold CI compile several minutes slower. Measured on one machine,
# a cold build of the parity test binary took 134 CPU-seconds unoptimized, 664 with every
# dependency optimized and 324 with this list. The `*-meta`, `*-macro` and `wit-*` packages are
# build-time only and stay unoptimized. A name that no longer matches a package after a wasmtime
# upgrade only draws a cargo warning and loses the speed-up, so check this list when wasmtime is
# bumped.
[profile.dev.package.cranelift-assembler-x64]
opt-level = 2

[profile.dev.package.cranelift-bforest]
opt-level = 2

[profile.dev.package.cranelift-bitset]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-codegen-shared]
opt-level = 2

[profile.dev.package.cranelift-control]
opt-level = 2

[profile.dev.package.cranelift-entity]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.cranelift-native]
opt-level = 2

[profile.dev.package.gimli]
opt-level = 2

[profile.dev.package.object]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmparser]
opt-level = 2

[profile.dev.package.wasmtime]
opt-level = 2

[profile.dev.package.wasmtime-environ]
opt-level = 2

[profile.dev.package.wasmtime-internal-cache]
opt-level = 2

[profile.dev.package.wasmtime-internal-core]
opt-level = 2

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2

[profile.dev.package.wasmtime-internal-fiber]
opt-level = 2

[profile.dev.package.wasmtime-internal-unwinder]
opt-level = 2

[profile.release]
lto = "thin"
overflow-checks = true
strip = true
