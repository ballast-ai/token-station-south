[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/GlimpseEngine/token-station-south"
rust-version = "1.96"
version = "0.42.0"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
http = "1.3.1"
proptest = "1.7.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = "1.0.219"
serde_json = "1.0.140"
# Test-only: the gate 2 report digests the component it judged. Already in the graph through
# wasmtime (cranelift-codegen), so this adds no crate.
sha2 = "0.10.9"
static_assertions = "1.1.0"
thiserror = "2.0.12"
token-station-protocol = { version = "0.4.0", git = "https://github.com/ballast-ai/token-station-kernel.git", rev = "f585bc83e5f8a31fbbc6535dd17c3ac8deec6a54" }
tokio = "1.52.3"
tokio-util = "0.7.18"
url = "2.5.4"
wasmtime = { version = "49", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
    # Compilation cache: compiling each component with Cranelift on every start
    # takes seconds; persist by content and config hash.
    "cache",
    # Tests hand-write WAT for a component importing wasi:sockets to prove the
    # rejection path. Production loads binary .wasm without WAT.
    "wat",
] }
wasmtime-wasi = "49"
wit-parser = "0.259"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
overflow-checks = true
strip = true
