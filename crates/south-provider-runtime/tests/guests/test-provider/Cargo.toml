# The runtime's test guest: a real wasm32-wasip2 component, built by the test
# harness as a child cargo invocation. Standalone because it compiles for a
# different target, and JSON-only on purpose: the runtime under test is
# IR-free, so its test guest is too.
[package]
name = "test-provider"
version = "1.0.0"
edition = "2021"
publish = false

# Standalone: stops cargo from walking up into the main workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.59"
