# A canary task component for an adopting host's "unknown task family"
# acceptance (T09.7): the host binary is built once, then only a component
# package and configuration change. Nothing in this crate is released; it
# exists so a host can prove it runs a task family its binary never heard of.
#
# Standalone and JSON-only for the same reasons as `t03-canary-provider`: it
# compiles for a different target, and it must not share translation code with
# any reference implementation — a canary that reused one would prove only that
# the known families still work.
[package]
name = "t09-canary-task"
version = "1.0.0"
edition = "2021"
publish = false

# Standalone: stops cargo from walking up into the main workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.59"
