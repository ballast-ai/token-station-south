[package]
description = "Reusable public contract tests for south consumers."
edition.workspace = true
license.workspace = true
name = "south-testkit"
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
serde_json.workspace = true
south-contracts = { path = "../south-contracts", version = "0.56.0" }
south-core = { path = "../south-core", version = "0.67.0" }
south-host-grammars = { path = "../south-host-grammars", version = "0.67.0" }
south-provider-api = { path = "../south-provider-api", version = "0.59.0" }
south-provider-conformance = { path = "../south-provider-conformance", version = "0.67.0" }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
static_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
