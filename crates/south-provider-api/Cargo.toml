[package]
description = "Provider component API and WIT ownership boundary."
edition.workspace = true
license.workspace = true
name = "south-provider-api"
publish = false
repository.workspace = true
rust-version.workspace = true
# Its own version, not the workspace's: every component links this crate, and its version
# enters the component's bytes. It moves only when this crate changes, so a South release
# that leaves it alone re-identifies no package (host-zero-vendor-boundary §16 Q47).
version = "0.49.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
wit-parser.workspace = true

[lints]
workspace = true
