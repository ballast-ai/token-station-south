[package]
description = "Host-neutral provider execution contracts for Token Station"
edition.workspace = true
license.workspace = true
name = "south-contracts"
publish = false
repository.workspace = true
rust-version.workspace = true
# Its own version, not the workspace's: every component links this crate, and its version
# enters the component's bytes. It moves only when this crate changes, so a South release
# that leaves it alone re-identifies no package (host-zero-vendor-boundary §16 Q47).
version = "0.50.0"

[dependencies]
bytes.workspace = true
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
serde = { workspace = true, features = ["derive"] }
static_assertions.workspace = true

[lints]
workspace = true
