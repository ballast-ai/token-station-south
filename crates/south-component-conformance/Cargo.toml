[package]
description = "Component-package and component-behavior conformance gates for provider components."
edition.workspace = true
license.workspace = true
name = "south-component-conformance"
publish = false
repository.workspace = true
rust-version.workspace = true
# Its own version, not the workspace's: every component links this crate, and its version
# enters the component's bytes. It moves only when this crate changes, so a South release
# that leaves it alone re-identifies no package (host-zero-vendor-boundary §16 Q47).
version = "0.49.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
south-contracts = { path = "../south-contracts", version = "0.49.0" }
south-provider-api = { path = "../south-provider-api", version = "0.49.0" }
# A lower bound, not the exact release: the runtime keeps the workspace version, and an exact
# requirement would have to be edited in this manifest at every release (§16 Q47). Only the
# `sandbox` feature, which no component enables, links it.
south-provider-runtime = { path = "../south-provider-runtime", version = ">=0.49.0", optional = true }
token-station-protocol.workspace = true

[features]
# The host-side typed seam over a sandboxed instance. A feature so that
# guests, which depend on this crate for the abi shims and compile to
# wasm32-wasip2, never pull wasmtime into their build.
sandbox = ["dep:south-provider-runtime"]

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true

[[test]]
name = "sandbox_parity_v1"
required-features = ["sandbox"]

[[test]]
name = "anthropic_sandbox_parity_v1"
required-features = ["sandbox"]

[[test]]
name = "gemini_sandbox_parity_v1"
required-features = ["sandbox"]

[[test]]
name = "bedrock_converse_sandbox_parity_v1"
required-features = ["sandbox"]

[[test]]
name = "bedrock_converse_bearer_sandbox_parity_v1"
required-features = ["sandbox"]

[[test]]
name = "kling_task_sandbox_parity_v1"
required-features = ["sandbox"]

[[test]]
name = "kling_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "minimax_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "bailian_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "xai_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "byteplus_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "veo_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "wan_image_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "gmi_image_task_sandbox_parity_v2"
required-features = ["sandbox"]

[[test]]
name = "openai_compatible_embeddings_sandbox_parity"
required-features = ["sandbox"]

[[test]]
name = "gemini_embeddings_sandbox_parity"
required-features = ["sandbox"]

[[test]]
name = "vertex_embeddings_sandbox_parity"
