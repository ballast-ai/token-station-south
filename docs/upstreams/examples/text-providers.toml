# 常见文本供应商的目录元数据，核实于 2026-11-25。
# 普通 Chat 项使用 openai-compatible 族；Anthropic 使用已有 anthropic 族。
# 只包含供应商，不包含凭证、型号、价格或能力声明。
# 新库可作为首启目录片段；存量部署须经管理 API 显式创建缺项。
# 管理 API 创建时默认停用，不覆盖同名既有配置，不自动启用。
# 认证由各族组件处理；API Key 在既有凭证功能录入，不在此文件填写。
# 账户、站点、型号、价格和真实调用需分别验收，详见 ../common-chat-providers.md。

